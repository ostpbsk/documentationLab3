<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="container">
    <h1>Edit Event</h1>

    <form method="post">
        <label>Title</label>
        <input name="title" value="{{ event.title }}" required>

        <label>Genre</label>
        <input name="genre" value="{{ event.genre }}" required>

        <button type="submit">Update</button>
    </form>

    <a href="/">⬅ Back</a>
</div>
